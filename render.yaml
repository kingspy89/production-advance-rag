services:
  # FastAPI Backend Service
  - type: web
    name: enterprise-rag-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_CLUSTER_ENDPOINT
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FALLBACK_API_KEY
        sync: false
      - key: PORTKEY_API_KEY
        sync: false
      - key: PORTKEY_CONFIG_ID
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: "rag_scale_test"
      - key: LANGSMITH_ENDPOINT
        value: "https://api.smith.langchain.com"

  # Streamlit Frontend UI Service
  - type: web
    name: enterprise-rag-ui
    env: docker
    dockerfilePath: ./Dockerfile.ui
    plan: free
    envVars:
      - key: BACKEND_URL
        sync: false  # Set to the URL of the deployed enterprise-rag-api service
